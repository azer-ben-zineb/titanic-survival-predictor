{% extends "predictor/base.html" %}

{% block content %}
<div class="easter-egg-wrapper">
    <div class="easter-egg-card">
        <!-- Visual Animation: Night Sky, Tilting Ship, Drifting Lifeboats -->
        <div class="animation-stage">
            <div class="stars"></div>
            <div class="moon"></div>
            <div class="ocean">
                <!-- Drifting lifeboats -->
                <div class="lifeboat lifeboat-1">⛵</div>
                <div class="lifeboat lifeboat-2">⛵</div>
                <div class="waves"></div>
            </div>
            <!-- Tilting ship silhouette -->
            <div class="ship-silhouette">
                <div class="funnels">
                    <span class="funnel"></span>
                    <span class="funnel"></span>
                    <span class="funnel"></span>
                    <span class="funnel"></span>
                </div>
                <div class="hull"></div>
            </div>
        </div>

        <div class="easter-egg-content">
            <span class="music-clef">𝄞 𝄢 ♩ ♫</span>
            <h1 class="easter-egg-title">{{ i18n.musician_title }}</h1>
            <p class="easter-egg-date">{{ i18n.musician_subtitle }}</p>

            <blockquote class="musician-quote">
                {{ musician_sentence }}
            </blockquote>

            <!-- Optional Audio Slot -->
            {% if has_audio %}
            <div class="audio-player-container">
                <audio controls class="audio-control">
                    {% load static %}
                    <source src="{% static 'audio/titanic_band.mp3' %}" type="audio/mpeg">
                    Your browser does not support audio playback.
                </audio>
                <p class="audio-caption">{{ i18n.audio_play }}</p>
            </div>
            {% endif %}

            <div class="easter-egg-actions">
                <a href="{% url 'predict' %}" class="btn btn-primary">
                    &larr; {{ i18n.btn_try_another }}
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
